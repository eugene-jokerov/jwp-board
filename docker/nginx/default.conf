server {
    listen 80;
    server_name _;

    # Корень Laravel: public/index.php
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # Логи в stdout/stderr — видны через `make logs`.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # fastcgi_split_path_info нужен для корректного PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Заголовки для корректной работы Laravel за прокси
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    # Скрытые файлы (.env, .git и т.п.) наружу не отдаём
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
