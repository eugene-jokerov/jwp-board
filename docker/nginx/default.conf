server {
    listen 80;
    server_name _;

    # Корень Laravel: public/index.php, лендинг public/landing, сборка веб-версии public/board.
    root /var/www/html/public;
    index index.html index.php;

    # Относительные Location в редиректах: по умолчанию nginx подставляет
    # $scheme://$host (server_name _), и порт 8080 из запроса теряется —
    # браузер уезжает на http://localhost/ без порта API.
    absolute_redirect off;

    charset utf-8;
    client_max_body_size 32m;

    # Логи в stdout/stderr — видны через `make logs`.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Лендинг и API. Правило повторяет public/.htaccess на хостинге:
    # существующие файлы отдаются как есть, остальное уходит во фронт-контроллер.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Скрытые файлы (.env, .git, .htaccess и т.п.) наружу не отдаём.
    # Внимание: префиксные локации с ^~ (см. /board/ ниже) имеют приоритет над
    # регулярками, поэтому для /board/ это правило не действует — там такая же
    # проверка встроена в саму локацию.
    location ~ /\\.(?!well-known).* {
        deny all;
    }

    # Веб-версия приложения (SPA, сборка mobile): все маршруты отдают index.html.
    # ^~ — приоритет над регуляркой для .php: /board/** не должен попадать в PHP.
    # Редирект на слэш отдаём сами, относительным Location: у try_files адрес
    # склеивается из $scheme/$host (server_name _), и порт 8080 теряется.
    location = /board {
        return 302 /board/;
    }

    # Скрытые файлы сборки (.htaccess и т.п.) не отдаём: регулярки выше внутри
    # ^~-локации не проверяются, поэтому проверка стоит здесь. Существующий файл
    # try_files отдаёт напрямую по $uri — до fallback запрос не доходит.
    location ^~ /board/ {
        if ($uri ~ "/\\.[^/]+$") {
            return 404;
        }

        try_files $uri $uri/ /board/index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # fastcgi_split_path_info нужен для корректного PATH_INFO
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Заголовки для корректной работы Laravel за прокси
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }
}
