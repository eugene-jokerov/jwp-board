; Xdebug: по умолчанию выключен, включается переменной PHP_XDEBUG_MODE (см. .env).
; Примечание: строковая подстановка ${...} в ini-файлах поддерживается только
; php.ini, не .ini из conf.d, поэтому настройки задаются переменными окружения
; (XDEBUG_MODE, XDEBUG_CONFIG) в docker-compose.yml.

; Конфигурация:
;   PHP_XDEBUG_MODE=debug   -> профайлер/брейкпоинты в PHPStorm
;   xdebug.client_host      -> host.docker.internal (Linux: extra_hosts host-gateway)
;   xdebug.idekey           -> PHPSTORM
