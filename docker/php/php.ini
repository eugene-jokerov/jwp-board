; Базовые настройки PHP для dev-окружения JWP Board.
date.timezone = Europe/Moscow

memory_limit = 512M
max_execution_time = 0
post_max_size = 32M
upload_max_filesize = 32M

; Ошибки видны в логах контейнера — для API этого достаточно.
display_errors = Off
log_errors = On
error_reporting = E_ALL

; OPcache включён: ускоряет artisan/phpstan/phpunit и приближает поведение к проду.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; В dev проверяем изменения файлов — валидация таймстампов обязательна.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug управляется переменными окружения (PHP_XDEBUG_MODE), конфигурация — в xdebug.ini.
