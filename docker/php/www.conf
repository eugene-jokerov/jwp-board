; Настройки PHP-FPM: слушаем все интерфейсы контейнера, работаем от пользователя из Dockerfile.
; В dev-режиме docker-compose.override.yml запускает fpm с флагом -R (от root),
; поэтому пользователь здесь не критичен, но при прямом запуске образа он нужен.
[www]
user = jwp
group = jwp

listen = 9000
listen.owner = jwp
listen.group = jwp
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Логи stderr/stdout — compose собирает их через `make logs`.
catch_workers_output = yes
decorate_workers_output = no

; Переменные окружения (PHP_XDEBUG_*, APP_*) должны доходить до воркеров.
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
