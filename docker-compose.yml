# Базовый (прод-подобный) compose-файл JWP Board.
# Код монтируется в образ на этапе сборки, локальные каталоги не пробрасываются.
# Для разработки используется docker-compose.override.yml (включается автоматически).
name: ${COMPOSE_PROJECT_NAME:-jwp-board}

services:
    php:
        build:
            context: ./docker/php
            args:
                APP_USER: ${APP_USER:-jwp}
                APP_UID: ${APP_UID:-1000}
                APP_GID: ${APP_GID:-1000}
                TIMEZONE: ${TIMEZONE:-Europe/Moscow}
        container_name: ${COMPOSE_PROJECT_NAME:-jwp-board}-php
        working_dir: /var/www/html
        environment:
            PHP_IDE_CONFIG: serverName=${COMPOSE_PROJECT_NAME:-jwp-board}
            XDEBUG_MODE: ${PHP_XDEBUG_MODE:-off}
            XDEBUG_CONFIG: client_host=${PHP_XDEBUG_HOST:-host.docker.internal} client_port=${PHP_XDEBUG_PORT:-9003} idekey=PHPSTORM
            COMPOSER_HOME: /tmp/composer
        volumes:
            - ./backend:/var/www/html
        networks:
            - jwp
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            mysql:
                condition: service_healthy
        restart: on-failure

    nginx:
        image: nginx:1.27-alpine
        container_name: ${COMPOSE_PROJECT_NAME:-jwp-board}-nginx
        ports:
            - "${API_HTTP_PORT:-8080}:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./backend:/var/www/html
        networks:
            - jwp
        depends_on:
            - php
        restart: on-failure

    mysql:
        image: mysql:8.4
        container_name: ${COMPOSE_PROJECT_NAME:-jwp-board}-mysql
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-jwp_board}
            MYSQL_USER: ${MYSQL_USER:-jwp}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jwp}
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - "${MYSQL_PORT:-3307}:3306"
        networks:
            - jwp
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: on-failure

    mysql-test:
        image: mysql:8.4
        container_name: ${COMPOSE_PROJECT_NAME:-jwp-board}-mysql-test
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-jwp_board_test}
            MYSQL_USER: ${MYSQL_USER:-jwp}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jwp}
        volumes:
            # Данные тестовой БД не сохраняются между перезапусками контейнера
            - /var/lib/mysql
        ports:
            - "${MYSQL_TEST_PORT:-3308}:3306"
        networks:
            - jwp
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
            interval: 5s
            timeout: 5s
            retries: 30
        restart: on-failure

    node:
        image: node:24-alpine
        container_name: ${COMPOSE_PROJECT_NAME:-jwp-board}-node
        working_dir: /app
        user: node
        command: sh -c "npx expo start --lan --clear"
        environment:
            # Адрес API для мобильного приложения. Для физического устройства/эмулятора
            # укажите IP хоста в локальной сети: http://192.168.x.x:8080
            EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
            EXPO_NO_TELEMETRY: "1"
            # CI=1 отключал наблюдение за файлами: правки на хосте не попадали в бандл
            # без перезапуска контейнера. Watch-режим нужен для hot reload.
            CI: "0"
        volumes:
            - ./mobile:/app
        ports:
            - "${EXPO_PORT:-8081}:8081"
            - "${EXPO_DEVTOOLS_PORT:-19000}:19000"
            - "${EXPO_DEVTOOLS_A_PORT:-19001}:19001"
            - "${EXPO_DEVTOOLS_B_PORT:-19002}:19002"
        networks:
            - jwp
        depends_on:
            - nginx
        healthcheck:
            test: ["CMD", "node", "-e", "process.exit(0)"]
            interval: 30s
            timeout: 5s
            retries: 3
        restart: on-failure

    # phpMyAdmin для основной и тестовой БД (http://localhost:8082).
    # Сервис в профиле tools: в обычный `make up` не попадает,
    # запускается явно — `make phpmyadmin`.
    phpmyadmin:
        image: phpmyadmin:5
        container_name: ${COMPOSE_PROJECT_NAME:-jwp-board}-phpmyadmin
        profiles:
            - tools
        environment:
            # Автовход под MYSQL_USER; серверы переключаются в левом меню.
            PMA_HOSTS: mysql,mysql-test
            PMA_VERBOSES: mysql,mysql-test
            PMA_PORTS: 3306,3306
            PMA_USER: ${MYSQL_USER:-jwp}
            PMA_PASSWORD: ${MYSQL_PASSWORD:-jwp}
            UPLOAD_LIMIT: 512M
            MEMORY_LIMIT: 512M
        ports:
            - "${PHPMYADMIN_PORT:-8082}:80"
        networks:
            - jwp
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
            interval: 30s
            timeout: 5s
            retries: 3
        restart: on-failure

volumes:
    mysql_data:

networks:
    jwp:
        driver: bridge
